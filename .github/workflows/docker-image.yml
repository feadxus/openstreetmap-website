name: Build OpenStreetMap Website Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 1️⃣ 拉取源码
      - name: Checkout source
        uses: actions/checkout@v4
      # 2️⃣ 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 3️⃣ 初始化 Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      # 4️⃣ 编译并推送
      - name: Build and Push OpenStreetMap Website
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openstreetmap-website:latest
          # 关闭缓存
          cache-from: ""
          cache-to: ""
